# 每次推送到 main、每个 pull request 都把测试、代码检查（ruff）和类型检查（mypy，下面的 types）跑一遍。
# 测试不需要 API 密钥、不花钱：模型那一头是 tests/ 里的本地假服务器（见 docs/zh-CN/testing.md）。
# 三个系统都跑（CLAUDE.md 第 9 条）：Windows 上命令是 PowerShell、后台服务是任务计划程序、文件权限是 ACL，只在那里才有的测试在那里才跑。
#
# 测试分成两种 job 同时跑（2026-11-24 为了让 CI 快一些拆开的，量过的数字见 docs/zh-CN/testing.md 的"CI"一节）：
#   test  除了页面测试以外的全部（-m "not ui"），三个系统 × 两个 Python 版本，一个不少
#   ui    页面测试（tests/ui/，-m ui），三个系统 × 一个 Python 版本；macOS、Windows 上再分成两份，在两台机器上同时跑
# 两种合起来正好是全部测试：每个测试要么带 ui 标记、要么不带（标记由 tests/ui/conftest.py 按文件夹打上）。
# 拆开以前是一个 job 里先跑别的、最后跑两百多个页面测试，macOS 上要十九分钟，其中十一分钟在等页面测试。
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20  # 并行跑（见 pyproject 的 addopts），平时几分钟；万一哪里卡住了，不让它一直占着机器
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    defaults:
      run:
        shell: bash  # 下面的几行是 bash 的写法；Windows 的 runner 上是 Git 带的 bash（测试里的命令照样在 PowerShell 里跑）
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --locked
      - name: More ephemeral ports (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # 测试里有几千个很短的连接（每个请求一条 TCP 连接，好几个测试进程同时跑）。Windows 默认只有 16384 个临时端口，
        # 用过的还要在 TIME_WAIT 里等两分钟，会被用光（页面测试里的 Chrome 报过 ERR_NO_BUFFER_SPACE）。只把这台 CI 机器的范围放宽
        run: netsh int ipv4 set dynamicport tcp start=10000 num=55535
      - name: Tests
        # 页面测试在下面的 ui 里跑。这里照样有用真的 Chrome 的 tests/test_browser_live.py（runner 上预装着，没有时它自己跳过）
        run: uv run pytest -q -m "not ui"
      - name: Lint
        run: uvx ruff@0.17.6 check harness tests

  # 页面测试（tests/ui/）：无界面的 Chrome 打开演示页面（tests/demo_web.py）实际操作。用 runner 上预装的 Chrome
  # （Ubuntu 是 google-chrome，macOS 在 /Applications 里，Windows 在 Program Files 里）。
  #
  # 为什么只用一个 Python 版本：页面测试查的是页面（HTML、CSS、脚本）和浏览器里的交互，Python 只是在后面跑演示服务器；
  # 那些 Python 代码（网页服务器、事件流、各个接口）在上面的 test 里两个版本都测，只在某个版本上才有的行为（argparse 的 --、
  # 绕圈的符号链接这类）也是在那里抓到的。选 3.13：本机开发用的是 3.11，页面测试在本机已经常跑，CI 上换另一个版本，两个版本都看得到。
  #
  # 为什么 macOS、Windows 分两份：每个页面测试都要 Chrome 真的画页面，很吃 CPU。GitHub 的 macOS 机器只有 3 个核，
  # 两百多个页面测试在一台上要十一分钟；分到两台上各跑一半（HARNESS_TEST_SHARD，怎么分见 tests/shards.py：
  # 按收集的先后轮流发，几份合起来一个不少、一个不重，tests/test_shards.py 查）。Ubuntu 一台四分钟左右，不用分。
  # 份数多了会多占机器：macOS 的机器眼下紧张，这里一共五个 macOS 的 job（test 两个、ui 两个、package 一个），
  # 比拆开以前多两个，但每个短得多，加起来占用的机器时间从四十分钟左右降到二十多分钟。
  ui:
    name: page tests · ${{ matrix.os }} · part ${{ matrix.part }}/${{ matrix.parts }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, part: 1, parts: 1 }
          - { os: macos-latest, part: 1, parts: 2 }
          - { os: macos-latest, part: 2, parts: 2 }
          - { os: windows-latest, part: 1, parts: 2 }
          - { os: windows-latest, part: 2, parts: 2 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install
        run: uv sync --locked
      - name: More ephemeral ports (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # 和上面的 test 一样：页面测试里的 Chrome 和演示服务器之间也是成千上万条很短的连接
        run: netsh int ipv4 set dynamicport tcp start=10000 num=55535
      - name: Chrome
        # 只是打印出来，方便看是哪个版本。找不到的话下面的页面测试会失败（HARNESS_UI_REQUIRED），不会悄悄跳过
        run: |
          if command -v google-chrome >/dev/null; then google-chrome --version
          elif [ -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" ]; then "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version
          elif [ -f "/c/Program Files/Google/Chrome/Application/chrome.exe" ]; then powershell -c "(Get-Item 'C:/Program Files/Google/Chrome/Application/chrome.exe').VersionInfo.ProductVersion"
          else echo "没有找到 Chrome"; fi
      - name: Page tests
        run: uv run pytest -q -m ui
        env:
          HARNESS_UI_REQUIRED: "1"  # 页面测试找不到 Chrome 时算失败，而不是跳过
          HARNESS_UI_ARTIFACTS: ${{ runner.temp }}/ui-artifacts  # 页面测试失败时的截图、控制台输出、页面 HTML
          HARNESS_TEST_SHARD: ${{ matrix.part }}/${{ matrix.parts }}  # 只跑其中一份（见 tests/shards.py）；1/1 就是全部
      - name: Upload page test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-artifacts-${{ matrix.os }}-part${{ matrix.part }}of${{ matrix.parts }}
          path: ${{ runner.temp }}/ui-artifacts
          if-no-files-found: ignore
          retention-days: 7

  # 类型检查（mypy，配置在 pyproject.toml 的 [tool.mypy]）。它读的是代码和类型说明，不运行任何东西，结果和在哪台机器上跑无关，
  # 所以只开一台 ubuntu：用 --platform 换成三个系统的眼光各查一遍（系统相关的代码写成 sys.platform 的判断，mypy 才认得，
  # Windows 才有的 msvcrt、只有 macOS / Linux 有的 killpg 都只在对应的那一遍里查）。
  # 用 uv run --with 而不是 uvx：要在项目自己的环境里跑，才看得到 anthropic、openai 这些 SDK 自带的类型（见 pyproject.toml）
  types:
    name: mypy · linux, darwin, win32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"  # 和 [tool.mypy] 的 python_version 一样
      - name: Install
        run: uv sync --locked
      - name: Type check
        # 三遍都跑完再算结果：一遍出了错，另外两遍的错也一起看到
        run: |
          status=0
          for platform in linux darwin win32; do
            echo "::group::mypy --platform $platform"
            uv run --with mypy==1.19.0 mypy --platform "$platform" || status=1
            echo "::endgroup::"
          done
          exit $status

  # 操作整台电脑：真的 Linux 后端（xdotool、ImageMagick）在一块虚拟的屏幕（Xvfb）上跑一遍（tests/test_desktop_x11.py）。
  # 别的地方这个测试会跳过；这里设了 ZHIFOX_REQUIRE_XVFB，缺了什么就算失败，不会悄悄地被跳过。只在 ubuntu 上跑：macOS 没有 Xvfb
  desktop:
    name: computer use · Xvfb · ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install Xvfb, xdotool, ImageMagick
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xdotool imagemagick
      - name: Install
        run: uv sync --locked
      - name: Real X11 backend on a virtual screen
        env:
          ZHIFOX_REQUIRE_XVFB: "1"
        run: uv run pytest -q -n 0 -rs tests/test_desktop_x11.py  # 一个一个跑：几个进程同时开 Xvfb 可能挑中同一个屏幕编号

  # 命令的沙箱：真的 bubblewrap（bwrap）在 Linux 上跑一遍（tests/test_sandbox_linux.py，和 macOS 的 test_sandbox_macos.py 是同一组关卡）。
  # 设了 HARNESS_SANDBOX_REQUIRED：装了 bwrap 却建不了沙箱时算失败，不会悄悄地被跳过。只在 ubuntu 上跑
  sandbox:
    name: sandbox · bubblewrap · ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install bubblewrap
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap
          bwrap --version
          # 和 harness/sandbox/linux.py 的 problem 试的是同样几样。Ubuntu 24.04 起 AppArmor 默认不许普通用户建用户命名空间
          # （docs/zh-CN/sandbox-and-hooks.md 的沙箱一节写着）：建得了就照原样测；建不了才放开这一条，并在日志里说一声
          if ! bwrap --die-with-parent --unshare-pid --unshare-net --ro-bind / / --proc /proc --dev /dev true; then
            echo "这台 runner 不许普通用户建用户命名空间：放开 kernel.apparmor_restrict_unprivileged_userns"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install
        run: uv sync --locked
      - name: Real bubblewrap sandbox
        env:
          HARNESS_SANDBOX_REQUIRED: "1"
        run: uv run pytest -q -rs tests/test_sandbox_linux.py tests/test_sandbox.py

  # 打包和试装：和发布时（release.yml 的 build、smoke）一样打出 wheel 和源码包，在三个系统上各装进一个干净的环境里试一次
  # （tests/smoke_release.py：harness/ 下的文件一个不少、命令能启动）。平常每次推送都跑，免得到了发布那一刻才发现装不上：
  # 0.2.0 第一次发布就停在 Windows 那一项上（那次是试装脚本自己的 print 在 cp1252 的管道上出错）
  package:
    name: package · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build
        run: uv build --no-sources
      - name: Install and try the wheel and the source archive
        run: |
          version=$(uv version --short)
          uv run --isolated --no-project --python 3.11 --with "$(ls dist/*.whl)" tests/smoke_release.py "$version"
          uv run --isolated --no-project --python 3.13 --with "$(ls dist/*.tar.gz)" tests/smoke_release.py "$version"
