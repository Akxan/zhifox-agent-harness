# 每次推送到 main、每个 pull request 都把测试和代码检查跑一遍。
# 测试不需要 API 密钥、不花钱：模型那一头是 tests/ 里的本地假服务器（见 README 的 Testing 一节）。
# 页面测试（tests/ui/）用 runner 上预装的 Chrome（Ubuntu 是 google-chrome，macOS 在 /Applications 里，Windows 在 Program Files 里），无界面运行。
# 三个系统都跑（CLAUDE.md 第 9 条）：Windows 上命令是 PowerShell、后台服务是任务计划程序、文件权限是 ACL，只在那里才有的测试在那里才跑。
name: tests

on:
  push:
    branches: [main, ci-windows]  # 临时：ci-windows 分支上调 Windows，合并前去掉
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30  # 并行跑（见 pyproject 的 addopts），平时几分钟；万一哪里卡住了，不让它一直占着机器
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    defaults:
      run:
        shell: bash  # 下面的几行是 bash 的写法；Windows 的 runner 上是 Git 带的 bash（测试里的命令照样在 PowerShell 里跑）
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --locked
      - name: Chrome
        # 只是打印出来，方便看是哪个版本。找不到的话下面的页面测试会失败（HARNESS_UI_REQUIRED），不会悄悄跳过
        run: |
          if command -v google-chrome >/dev/null; then google-chrome --version
          elif [ -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" ]; then "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version
          elif [ -f "/c/Program Files/Google/Chrome/Application/chrome.exe" ]; then powershell -c "(Get-Item 'C:/Program Files/Google/Chrome/Application/chrome.exe').VersionInfo.ProductVersion"
          else echo "没有找到 Chrome"; fi
      - name: Tests
        run: uv run pytest -q
        env:
          HARNESS_UI_REQUIRED: "1"  # 页面测试找不到 Chrome 时算失败，而不是跳过
          HARNESS_UI_ARTIFACTS: ${{ runner.temp }}/ui-artifacts  # 页面测试失败时的截图、控制台输出、页面 HTML
      - name: Lint
        run: uvx ruff@0.17.6 check harness tests
      - name: Upload page test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-artifacts-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/ui-artifacts
          if-no-files-found: ignore
          retention-days: 7

  # 操作整台电脑：真的 Linux 后端（xdotool、ImageMagick）在一块虚拟的屏幕（Xvfb）上跑一遍（tests/test_desktop_x11.py）。
  # 别的地方这个测试会跳过；这里设了 ZHIFOX_REQUIRE_XVFB，缺了什么就算失败，不会悄悄地被跳过。只在 ubuntu 上跑：macOS 没有 Xvfb
  desktop:
    name: computer use · Xvfb · ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install Xvfb, xdotool, ImageMagick
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xdotool imagemagick
      - name: Install
        run: uv sync --locked
      - name: Real X11 backend on a virtual screen
        env:
          ZHIFOX_REQUIRE_XVFB: "1"
        run: uv run pytest -q -n 0 -rs tests/test_desktop_x11.py  # 一个一个跑：几个进程同时开 Xvfb 可能挑中同一个屏幕编号
