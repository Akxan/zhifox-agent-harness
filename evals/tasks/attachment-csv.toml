# 随消息发来的文本附件（像在网页上拖进来一个 CSV）：看它会不会直接读附件回答，算对最大的那一笔。
title = "从附件里的表格找出最大的一笔"
tags = ["attachments"]
messages = ["这张表里金额最大的是哪一笔？"]

[[attachments]]
path = "11月报销.csv"
text = """日期,类别,商家,金额
2026-11-03,交通,滴滴出行,46.50
2026-11-05,餐饮,海底捞,386.00
2026-11-09,住宿,全季酒店,1288.00
2026-11-12,办公,得力文具,219.90
2026-11-18,餐饮,瑞幸咖啡,27.00
"""

[budget]
requests = 1

[[graders]]
type = "reply_contains"
text = ["全季", "1288"]

# 附件就在消息里，不用再去翻工作目录
[[graders]]
type = "tool_not_called"
name = "run_command"

[[dry_run]]
say = "金额最大的是 11 月 9 日在全季酒店的住宿，1288.00 元。"
