[project]
name = "harness-assistant"
version = "0.1.0"
description = "智狐：一个手写的 agent harness，运行在你自己电脑上的个人助手"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.11.0",
    "openai>=3.57.0",
    "prompt-toolkit>=3.0.53",
]

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
