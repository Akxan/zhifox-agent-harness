[project]
name = "harness-assistant"
version = "0.1.0"
description = "ZhiFox (智狐): a hand-written AI agent harness in Python, no frameworks. A local-first personal assistant with a terminal and web UI for Claude, GPT, Gemini and DeepSeek."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Akxan" }]
requires-python = ">=3.11"
keywords = [
    "ai-agent",
    "agent-harness",
    "llm-agent",
    "llm",
    "ai-assistant",
    "personal-assistant",
    "claude",
    "anthropic",
    "openai",
    "gemini",
    "deepseek",
    "tool-use",
    "function-calling",
    "local-first",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: English",
    "Natural Language :: Spanish",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=2.11.0",
    "openai>=3.57.0",
    "prompt-toolkit>=3.0.53",
]

# 可选的依赖：聊天通道里飞书、钉钉收消息用的官方 SDK（见 harness/channels/feishu.py、dingtalk.py）。
# 不装的话别的平台照样能用，页面上会说怎么装：uv sync --extra feishu --extra dingtalk
# （以后运行 uv sync 也要带上它们，不然会被卸掉）。版本的上限是看过源码的那一版：两个 SDK 都没有公开的"停下"，
# 我们用到了它们内部的几个名字，换了大版本要重新看一遍
[project.optional-dependencies]
feishu = ["lark-oapi>=1.8.0,<1.9"]
dingtalk = ["dingtalk-stream>=0.24.3,<0.25"]

[project.urls]
Homepage = "https://github.com/Akxan/zhifox-agent-harness"
Repository = "https://github.com/Akxan/zhifox-agent-harness"
Issues = "https://github.com/Akxan/zhifox-agent-harness/issues"
"Docs (简体中文)" = "https://github.com/Akxan/zhifox-agent-harness/blob/main/README.zh-CN.md"

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["hatchling>=1.27"]  # 1.27 起支持 license = "MIT" 这种写法（PEP 639）
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]  # harness/ 下的文件都会打进包里，包括网页的骨架、样式和脚本（webui/page/）和 markdown.js

[tool.pytest.ini_options]
testpaths = ["tests"]
# 默认并行跑（pytest-xdist）：有几个 CPU 核心就开几个进程，全部测试从九分钟左右降到一分多钟。
# 每个进程各有自己的假服务器、临时目录（页面测试还有自己的演示服务器和 Chrome），互不相干。
# 想一个一个跑（调试、看 print 的输出）时加 -n 0
addopts = ["-n", "auto"]
markers = [
    "ui: 页面测试（tests/ui/）：用无界面的 Chrome 打开演示页面实际操作。没有 Chrome 时跳过",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
]
