[project]
name = "harness-assistant"
version = "0.1.0"
description = "ZhiFox (智狐): a hand-written AI agent harness in Python, no frameworks. A local-first personal assistant with a terminal and web UI for Claude, GPT, Gemini and DeepSeek."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Akxan" }]
requires-python = ">=3.11"
keywords = [
    "ai-agent",
    "agent-harness",
    "llm-agent",
    "llm",
    "ai-assistant",
    "personal-assistant",
    "claude",
    "anthropic",
    "openai",
    "gemini",
    "deepseek",
    "tool-use",
    "function-calling",
    "local-first",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: English",
    "Natural Language :: Spanish",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=2.11.0",
    "openai>=3.57.0",
    "prompt-toolkit>=3.0.53",
]

[project.urls]
Homepage = "https://github.com/Akxan/zhifox-agent-harness"
Repository = "https://github.com/Akxan/zhifox-agent-harness"
Issues = "https://github.com/Akxan/zhifox-agent-harness/issues"
"Docs (简体中文)" = "https://github.com/Akxan/zhifox-agent-harness/blob/main/README.zh-CN.md"

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["hatchling>=1.27"]  # 1.27 起支持 license = "MIT" 这种写法（PEP 639）
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
