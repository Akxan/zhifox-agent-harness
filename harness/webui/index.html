<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Harness 个人助手</title>
<link rel="icon" href="data:,">
<style nonce="__NONCE__">
:root {
  color-scheme: light dark;
  --bg: #f6f6f3;
  --surface: #ffffff;
  --text: #1d1f23;
  --muted: #6a6f78;
  --line: #dfdfd9;
  --accent: #2b62d9;
  --on-accent: #ffffff;
  --user: #e4ecfb;
  --warn-bg: #fff6dc;
  --warn-line: #e2b33c;
  --ok: #1f8a4c;
  --err: #c5303b;
  --code: #efefea;
  --sans: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16171a;
    --surface: #1e2024;
    --text: #e7e7e4;
    --muted: #9a9fa8;
    --line: #32353b;
    --accent: #6b9bff;
    --on-accent: #10131a;
    --user: #24324d;
    --warn-bg: #372f17;
    --warn-line: #9a7a22;
    --ok: #4cc27a;
    --err: #ff6b6b;
    --code: #272a2f;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 15px/1.6 var(--sans); }
[hidden] { display: none !important; }
button { font: inherit; cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
a { color: var(--accent); }

/* 顶栏 */
.bar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar h1 { margin: 0; font-size: 15px; font-weight: 600; white-space: nowrap; }
.meta { flex: 1; min-width: 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ghost { background: none; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 4px 12px; font-size: 13px; white-space: nowrap; }
.ghost:hover:not(:disabled) { border-color: var(--muted); }
.banner { padding: 8px 16px; background: var(--warn-bg); border-bottom: 1px solid var(--warn-line); font-size: 13px; }

/* 主体：左边对话，右边侧栏 */
.layout { flex: 1; min-height: 0; display: flex; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.chat { flex: 1; overflow-y: auto; padding: 20px 16px 8px; }
.column { max-width: 760px; margin: 0 auto; }
.log { display: flex; flex-direction: column; gap: 10px; }

/* 消息 */
.msg { white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; max-width: 85%; padding: 8px 12px; background: var(--user); border-radius: 12px 12px 2px 12px; }
.thinking { color: var(--muted); font-size: 13px; border-left: 2px solid var(--line); padding-left: 10px; }
.thinking summary { cursor: pointer; user-select: none; }
.thinking-body { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 4px; }
.notice { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.notice.error { color: var(--err); }
.notice.tool { font-family: var(--mono); font-size: 12px; }
.notice.result { padding-left: 16px; }

/* 工具调用卡片 */
.tool { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; font-size: 13px; }
.tool summary { display: flex; align-items: center; gap: 8px; padding: 6px 10px; cursor: pointer; list-style: none; }
.tool summary::-webkit-details-marker { display: none; }
.dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.pending { animation: pulse 1s ease-in-out infinite; }
.dot.ok { background: var(--ok); }
.dot.failed { background: var(--err); }
@keyframes pulse { 50% { opacity: .25; } }
.tool-name { flex: 0 1 auto; min-width: 0; font-family: var(--mono); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tool-outcome { flex: 1 1 0; min-width: 0; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tool.failed .tool-outcome { color: var(--err); }
.tool-body { padding: 0 10px 10px; }
.label { margin: 8px 0 4px; color: var(--muted); font-size: 12px; }
pre { margin: 0; font: 12px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.tool-body pre { max-height: 280px; overflow: auto; padding: 8px; background: var(--code); border-radius: 6px; }

/* 确认卡片 */
.confirm { padding: 12px; background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 8px; }
.confirm-title { font-weight: 600; }
.confirm pre { margin: 6px 0 12px; font-size: 13px; max-height: 320px; overflow: auto; }
.confirm-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.confirm-actions button { border: 1px solid var(--warn-line); border-radius: 8px; padding: 5px 16px; background: var(--surface); color: var(--text); }
.confirm-actions .allow { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.reason { flex: 1 1 220px; min-width: 0; padding: 6px 10px; font: inherit; font-size: 13px; color: inherit; background: var(--surface); border: 1px solid var(--warn-line); border-radius: 8px; }
.outcome { font-size: 13px; color: var(--muted); }
.outcome.allowed { color: var(--ok); }
.outcome.denied { color: var(--err); }
.confirm.done { opacity: .75; }

/* 空白状态 */
.empty { margin-top: 12vh; text-align: center; color: var(--muted); }
.empty p { margin: 0 0 14px; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.chip { background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px; font-size: 13px; }
.chip:hover { border-color: var(--accent); }

/* 输入区 */
.working { min-height: 22px; margin-top: 10px; color: var(--muted); font-size: 13px; }
.composer { padding: 8px 16px 16px; }
.composer form { display: flex; align-items: flex-end; gap: 8px; }
.composer textarea { flex: 1; min-width: 0; max-height: 200px; resize: none; padding: 9px 12px; font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.composer textarea:focus, .reason:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.send { flex: none; padding: 9px 20px; background: var(--accent); color: var(--on-accent); border: 0; border-radius: 10px; }
.send.stop { background: var(--err); color: #fff; }

/* 侧栏 */
.side { width: 270px; flex: none; overflow-y: auto; padding: 16px; background: var(--surface); border-left: 1px solid var(--line); font-size: 13px; }
.side h2 { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
.side section + section { margin-top: 20px; }
.side ul { margin: 0; padding: 0; list-style: none; }
.side li { padding: 3px 0; overflow-wrap: anywhere; }
.due { color: var(--muted); font-size: 12px; }
.side .none { color: var(--muted); }
.usage { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; margin: 0; }
.usage dt { color: var(--muted); }
.usage dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.tool-item { display: flex; justify-content: space-between; gap: 8px; font-family: var(--mono); font-size: 12px; }
.where { flex: none; font-family: var(--sans); color: var(--muted); }
.cost { display: flex; justify-content: space-between; align-items: baseline; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); font-weight: 600; }
.cost span:last-child { font-size: 16px; font-variant-numeric: tabular-nums; }
.fine { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
@media (max-width: 900px) { .side { display: none; } }

/* 顶栏上的模型按钮 */
.model-button { max-width: 46vw; overflow: hidden; text-overflow: ellipsis; }
.model-button::after { content: " ▾"; color: var(--muted); }

/* 设置面板 */
.settings { width: min(660px, calc(100vw - 32px)); max-height: calc(100vh - 48px); padding: 0; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; font-size: 14px; }
.settings::backdrop { background: rgba(0, 0, 0, .45); }
.settings-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.settings-head h2 { margin: 0; font-size: 15px; }
.settings section { padding: 14px 18px; border-bottom: 1px solid var(--line); }
.settings h3 { margin: 0 0 8px; font-size: 13px; }
.settings .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.settings select, .settings input { min-width: 0; padding: 6px 10px; font: inherit; font-size: 13px; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
.settings select { flex: 1 1 180px; }
.settings input[type="password"] { flex: 1 1 220px; }
.settings input[type="number"] { width: 92px; }
.settings button { flex: none; white-space: nowrap; padding: 5px 12px; font-size: 13px; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.settings button:hover:not(:disabled) { border-color: var(--muted); }
.settings button.main { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
.settings label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.hint { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
.key-row + .key-row { margin-top: 14px; }
.key-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; margin-bottom: 6px; }
.key-status { font-size: 12px; color: var(--muted); }
.key-status.set { color: var(--ok); }
.key-head a { margin-left: auto; font-size: 12px; }
.settings-message { min-height: 20px; padding: 10px 18px 14px; font-size: 13px; color: var(--muted); }
.settings-message.bad { color: var(--err); }
.settings-message.good { color: var(--ok); }
</style>
</head>
<body>
<header class="bar">
  <h1>Harness 个人助手</h1>
  <span id="meta" class="meta"></span>
  <button id="model" class="ghost model-button" type="button" title="换模型、填写 API 密钥">设置</button>
  <button id="new" class="ghost" type="button">新对话</button>
</header>
<div id="banner" class="banner" hidden></div>

<div class="layout">
  <div class="main">
    <div id="chat" class="chat">
      <div class="column">
        <div id="empty" class="empty">
          <p>直接输入想说的话，或者从下面选一个试试。</p>
          <div class="chips">
            <button class="chip" type="button">提醒我周五下午交报告</button>
            <button class="chip" type="button">记住：我喜欢简短的回答</button>
            <button class="chip" type="button">这个目录里有哪些文件？</button>
            <button class="chip" type="button">我有哪些待办？</button>
          </div>
        </div>
        <div id="log" class="log"></div>
        <div id="working" class="working"></div>
      </div>
    </div>
    <div class="composer">
      <form id="form" class="column">
        <textarea id="input" rows="1" placeholder="输入消息。Enter 发送，Shift+Enter 换行" autofocus></textarea>
        <button id="send" class="send" type="submit">发送</button>
      </form>
    </div>
  </div>

  <aside class="side">
    <section>
      <h2>未完成的待办</h2>
      <ul id="todos"></ul>
    </section>
    <section>
      <h2>本次运行的用量（token）</h2>
      <dl id="usage" class="usage"></dl>
      <div class="cost"><span>估算费用</span><span id="cost">$0.0000</span></div>
      <p id="cost-note" class="fine"></p>
    </section>
    <section>
      <h2>模型可以使用的工具</h2>
      <ul id="tools"></ul>
    </section>
  </aside>
</div>

<dialog id="settings" class="settings">
  <div class="settings-head">
    <h2>设置</h2>
    <button id="close-settings" type="button">关闭</button>
  </div>
  <section>
    <h3>当前模型</h3>
    <div class="row">
      <select id="pick-provider" aria-label="厂商"></select>
      <select id="pick-model" aria-label="模型"></select>
      <button id="apply-model" class="main" type="button">使用这个模型</button>
    </div>
    <p class="hint">同一家之内换模型，对话可以接着进行；换到另一家会开始新对话。联网搜索只有 Claude 能用。</p>
  </section>
  <section>
    <h3>API 密钥</h3>
    <div id="keys"></div>
    <p class="hint">密钥保存在你自己电脑上的 .env 文件里。保存后这里只显示最后 4 位，不会再显示完整内容。</p>
  </section>
  <section>
    <h3>价格（用来估算费用，单位：美元 / 每百万 token）</h3>
    <div id="price" class="row"></div>
    <p id="price-note" class="hint"></p>
  </section>
  <div id="settings-message" class="settings-message"></div>
</dialog>

<script nonce="__NONCE__">
// 这个页面做的事情很少：
//   1. 连上服务器的事件流（/events），每收到一个事件，就在页面上画出对应的东西；
//   2. 用户发消息、点按钮时，向服务器发一个请求（/api/...）。
// 页面自己不保存对话。刷新之后，服务器会把这段对话的事件从头重发一遍，页面照着重新画出来。
//
// 安全上只有一条规矩：模型和工具输出的文字一律用 textContent 放进页面，从不当作 HTML 解析。
(() => {
  'use strict';

  const token = new URLSearchParams(location.search).get('token') || '';
  const $ = (id) => document.getElementById(id);
  const chat = $('chat'), log = $('log'), input = $('input'), sendButton = $('send');
  const banner = $('banner'), working = $('working'), empty = $('empty'), newButton = $('new');
  const settings = $('settings'), pickProvider = $('pick-provider'), pickModel = $('pick-model');

  let busy = false;          // 是否有一轮对话正在进行
  let state = null;          // 助手程序发来的最新状态：当前模型、各家的情况、用量……
  let block = null;          // 正在逐字输出的那一段：{kind, body, wrap, text}
  let toolCard = null;       // 最近一次工具调用的卡片，等它的结果来填
  const confirms = new Map(); // 还没答复的确认卡片

  // ---- 小工具 --------------------------------------------------------------

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  // 用户正看着最新内容时，新内容出现后自动滚到底；如果他往上翻了，就不打扰
  function keepAtBottom(change) {
    const atBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 80;
    change();
    if (atBottom) chat.scrollTop = chat.scrollHeight;
  }

  function add(node) {
    empty.hidden = true;
    keepAtBottom(() => log.appendChild(node));
    return node;
  }

  function firstLine(text) {
    const line = text.trim().split('\n')[0] || '';
    return line.length > 120 ? line.slice(0, 119) + '…' : line;
  }

  // 把文字里的网址变成可以点击的链接。链接是用 DOM 接口一个个创建的，不拼接 HTML。
  const URL_PATTERN = /https?:\/\/[^\s<>"'（）【】《》，。；！？、]+/g;
  function linkify(node, text) {
    const parts = document.createDocumentFragment();
    let last = 0;
    for (const match of text.matchAll(URL_PATTERN)) {
      const url = match[0].replace(/[.,;:!?)\]}]+$/, '');
      let safe = false;
      try { safe = ['http:', 'https:'].includes(new URL(url).protocol); } catch (_) { /* 不是合法网址 */ }
      if (!safe) continue;
      parts.appendChild(document.createTextNode(text.slice(last, match.index)));
      const link = el('a', null, url);
      link.href = url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      parts.appendChild(link);
      last = match.index + url.length;
    }
    parts.appendChild(document.createTextNode(text.slice(last)));
    node.replaceChildren(parts);
  }

  // 向助手程序发一个请求。返回 {ok, error, warning}，不会抛异常。
  async function call(path, data) {
    try {
      const response = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Harness-Token': token },
        body: JSON.stringify(data || {}),
      });
      const reply = await response.json().catch(() => ({}));
      return {
        ok: response.ok,
        error: response.ok ? '' : reply.error || '请求失败（' + response.status + '）',
        warning: reply.warning || '',
      };
    } catch (_) {
      showBanner('连接不上助手程序。它可能已经退出，请回到终端重新运行。');
      return { ok: false, error: '连接不上助手程序', warning: '' };
    }
  }

  // 对话区里用的：失败时把原因显示在对话里
  async function post(path, data) {
    const result = await call(path, data);
    if (!result.ok) add(el('div', 'notice error', result.error));
    return result.ok;
  }

  function showBanner(text) {
    banner.textContent = text;
    banner.hidden = false;
  }

  function refreshStatus() {
    sendButton.textContent = busy ? '停止' : '发送';
    sendButton.classList.toggle('stop', busy);
    newButton.disabled = busy;
    working.textContent = !busy ? '' : confirms.size ? '等待你确认……' : '助手正在工作……';
  }

  // ---- 逐字输出的文字 ------------------------------------------------------

  function stream(kind, text) {
    if (!block || block.kind !== kind) {
      endBlock();
      if (kind === 'thinking') {
        const wrap = el('details', 'thinking');
        wrap.open = true;
        wrap.appendChild(el('summary', null, '思考过程'));
        const body = wrap.appendChild(el('div', 'thinking-body'));
        add(wrap);
        block = { kind, body, wrap, text: '' };
      } else {
        block = { kind, body: add(el('div', 'msg assistant')), text: '' };
      }
    }
    block.text += text;
    keepAtBottom(() => block.body.appendChild(document.createTextNode(text)));
  }

  function endBlock() {
    if (!block) return;
    if (block.kind === 'thinking') block.wrap.open = false;  // 思考完就折叠起来，想看可以再点开
    else linkify(block.body, block.text);
    block = null;
  }

  // ---- 每种事件怎么画 ------------------------------------------------------

  const handlers = {
    reset() {
      log.replaceChildren();
      block = null;
      toolCard = null;
      confirms.clear();
      busy = false;
      empty.hidden = false;
      refreshStatus();
    },

    state(event) {
      state = event;
      const current = event.providers.find((provider) => provider.id === event.provider);
      $('meta').textContent = event.workspace;
      $('model').textContent = current.label + ' · ' + event.model;

      const todos = event.todos.map((item) => {
        const row = el('li', null, item.title);
        if (item.due) row.appendChild(el('span', 'due', '  截止 ' + item.due));
        return row;
      });
      $('todos').replaceChildren(...(todos.length ? todos : [el('li', 'none', '没有')]));

      const usage = event.usage;
      const rows = [['请求次数', usage.requests], ['联网搜索次数', usage.searches], ['输入（原价）', usage.input],
                    ['输入（命中缓存）', usage.cache_read], ['输入（写入缓存）', usage.cache_write], ['输出', usage.output],
                    ['当前对话占用的上下文', usage.context]];
      $('usage').replaceChildren(...rows.flatMap(([name, value]) => [el('dt', null, name), el('dd', null, value.toLocaleString())]));
      $('cost').textContent = '$' + event.cost.toFixed(4);
      $('cost-note').textContent = event.unpriced.length
        ? '没有计入 ' + event.unpriced.join('、') + '：还没有设置价格，可以在“设置”里填写。'
        : '按公开价格估算，实际以各家的账单为准。';

      $('tools').replaceChildren(...event.tools.map((tool) => {
        const row = el('li', 'tool-item');
        row.appendChild(el('span', null, tool.name));
        row.appendChild(el('span', 'where', tool.local ? '本地' : '服务器'));
        return row;
      }));

      if (settings.open) renderSettings();
    },

    user(event) { add(el('div', 'msg user', event.text)); },
    turn_start() { busy = true; refreshStatus(); },
    turn_end() { endBlock(); busy = false; refreshStatus(); },
    thinking(event) { stream('thinking', event.text); },
    text(event) { stream('text', event.text); },
    block_end() { endBlock(); },

    notice(event) {
      endBlock();
      add(el('div', 'notice ' + event.level, event.text));
    },

    tool_call(event) {
      endBlock();
      const card = el('details', 'tool');
      const summary = card.appendChild(el('summary'));
      const dot = summary.appendChild(el('span', 'dot pending'));
      summary.appendChild(el('span', 'tool-name', event.summary));
      const outcome = summary.appendChild(el('span', 'tool-outcome'));
      const body = card.appendChild(el('div', 'tool-body'));
      body.appendChild(el('div', 'label', '参数'));
      body.appendChild(el('pre', null, JSON.stringify(event.input, null, 2)));
      add(card);
      toolCard = { card, dot, outcome, body };
    },

    tool_result(event) {
      if (!toolCard) return;
      toolCard.dot.className = 'dot ' + (event.is_error ? 'failed' : 'ok');
      toolCard.card.classList.toggle('failed', event.is_error);
      toolCard.outcome.textContent = firstLine(event.text);
      toolCard.body.appendChild(el('div', 'label', '结果'));
      toolCard.body.appendChild(el('pre', null, event.text));
      toolCard = null;
    },

    confirm(event) {
      endBlock();
      const card = el('div', 'confirm');
      card.appendChild(el('div', 'confirm-title', '需要你确认'));
      card.appendChild(el('pre', null, '助手想要' + event.description.trimEnd()));
      const actions = card.appendChild(el('div', 'confirm-actions'));
      const allow = actions.appendChild(el('button', 'allow', '允许'));
      const deny = actions.appendChild(el('button', null, '拒绝'));
      const reason = actions.appendChild(el('input', 'reason'));
      allow.type = deny.type = 'button';
      reason.type = 'text';
      reason.placeholder = '拒绝时可以告诉助手原因（可选）';

      const answer = async (allowed) => {
        allow.disabled = deny.disabled = true;
        const sent = await post('/api/confirm', { id: event.id, allow: allowed, feedback: allowed ? '' : reason.value });
        if (!sent) allow.disabled = deny.disabled = false;
      };
      allow.addEventListener('click', () => answer(true));
      deny.addEventListener('click', () => answer(false));
      reason.addEventListener('keydown', (key) => {
        if (key.key === 'Enter' && !key.isComposing && key.keyCode !== 229) { key.preventDefault(); answer(false); }
      });

      add(card);
      confirms.set(event.id, { card, actions });
      refreshStatus();
    },

    confirm_done(event) {
      const pending = confirms.get(event.confirm);
      if (!pending) return;
      const label = event.allowed ? '已允许' : event.stopped ? '已中断' : '已拒绝';
      pending.actions.replaceChildren(el('span', 'outcome ' + (event.allowed ? 'allowed' : 'denied'), label));
      pending.card.classList.add('done');
      confirms.delete(event.confirm);
      refreshStatus();
    },
  };

  // ---- 发送消息 ------------------------------------------------------------

  function resizeInput() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight + 2, 200) + 'px';
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text || busy) return;
    if (await post('/api/message', { text })) {
      input.value = '';
      resizeInput();
      chat.scrollTop = chat.scrollHeight;
    }
  }

  $('form').addEventListener('submit', (submit) => {
    submit.preventDefault();
    if (busy) post('/api/stop'); else sendMessage();
  });

  input.addEventListener('keydown', (key) => {
    // 用输入法打中文时，按回车是"选定候选词"，不是发送，所以正在输入法组字时要忽略回车
    if (key.key !== 'Enter' || key.shiftKey || key.isComposing || key.keyCode === 229) return;
    key.preventDefault();
    sendMessage();  // 正忙的时候 sendMessage 什么都不做，避免误触变成"停止"
  });
  input.addEventListener('input', resizeInput);

  newButton.addEventListener('click', () => post('/api/new'));

  for (const chip of document.querySelectorAll('.chip')) {
    chip.addEventListener('click', () => {
      input.value = chip.textContent;
      resizeInput();
      input.focus();
    });
  }

  // ---- 设置面板 ------------------------------------------------------------

  function say(text, kind) {
    const box = $('settings-message');
    box.textContent = text;
    box.className = 'settings-message ' + (kind || '');
  }

  function fillModels(providerId, selected) {
    const provider = state.providers.find((one) => one.id === providerId);
    const options = provider.models.map((name) => {
      const option = el('option', null, name);
      option.value = name;
      return option;
    });
    if (!options.length) {
      const none = el('option', null, provider.has_key ? '（先点下面的“同步模型”）' : '（先填写这一家的 API 密钥）');
      none.value = '';
      options.push(none);
    }
    pickModel.replaceChildren(...options);
    if (provider.models.includes(selected)) pickModel.value = selected;
    $('apply-model').disabled = !provider.has_key || !provider.models.length;
  }

  // 把最新的状态画到设置面板上。面板开着的时候状态可能更新，所以要保留用户正在输入的内容。
  function renderSettings() {
    const typed = {};
    for (const input of settings.querySelectorAll('input[data-keep]')) typed[input.dataset.keep] = input.value;
    const chosenProvider = settings.dataset.ready ? pickProvider.value : state.provider;
    const chosenModel = settings.dataset.ready ? pickModel.value : state.model;
    settings.dataset.ready = '1';

    pickProvider.replaceChildren(...state.providers.map((provider) => {
      const option = el('option', null, provider.label + (provider.has_key ? '' : '（未设置密钥）'));
      option.value = provider.id;
      return option;
    }));
    pickProvider.value = chosenProvider;
    fillModels(chosenProvider, chosenModel);

    $('keys').replaceChildren(...state.providers.map((provider) => {
      const row = el('div', 'key-row');
      const head = row.appendChild(el('div', 'key-head'));
      head.appendChild(el('strong', null, provider.label));
      head.appendChild(el('span', 'key-status' + (provider.has_key ? ' set' : ''),
        provider.has_key ? '已设置 ' + (provider.key_hint || '') : '未设置'));
      if (provider.models.length) head.appendChild(el('span', 'key-status', provider.models.length + ' 个模型'));
      const link = head.appendChild(el('a', null, '去申请'));
      link.href = provider.key_page;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';

      const controls = row.appendChild(el('div', 'row'));
      const input = controls.appendChild(el('input'));
      input.type = 'password';
      input.autocomplete = 'off';
      input.placeholder = provider.has_key ? '粘贴新的 API 密钥可以替换' : '粘贴 API 密钥';
      input.dataset.keep = 'key-' + provider.id;
      input.value = typed[input.dataset.keep] || '';
      const save = controls.appendChild(el('button', 'main', '保存'));
      const sync = controls.appendChild(el('button', null, '同步模型'));
      const remove = controls.appendChild(el('button', null, '删除'));
      save.type = sync.type = remove.type = 'button';
      sync.disabled = remove.disabled = !provider.has_key;

      save.addEventListener('click', async () => {
        const key = input.value.trim();
        if (!key) { say('请先粘贴 API 密钥。', 'bad'); return; }
        input.value = '';  // 密钥一交出去就从输入框里清掉，不在页面上多留
        say('正在保存并同步模型列表……');
        const result = await call('/api/key', { provider: provider.id, key });
        say(result.ok ? result.warning || provider.label + ' 的密钥已保存，模型列表已同步。' : result.error,
            result.ok && !result.warning ? 'good' : 'bad');
      });
      sync.addEventListener('click', async () => {
        say('正在同步 ' + provider.label + ' 的模型列表……');
        const result = await call('/api/models', { provider: provider.id });
        say(result.ok ? provider.label + ' 的模型列表已更新。' : result.error, result.ok ? 'good' : 'bad');
      });
      remove.addEventListener('click', async () => {
        const result = await call('/api/key', { provider: provider.id, key: '' });
        say(result.ok ? provider.label + ' 的密钥已删除。' : result.error, result.ok ? 'good' : 'bad');
      });
      return row;
    }));

    // 当前模型的价格
    const price = state.price || {};
    const fields = [['input', '输入'], ['cache_read', '命中缓存的输入'], ['output', '输出']];
    const inputs = {};
    const priceRow = $('price');
    priceRow.replaceChildren();
    for (const [key, label] of fields) {
      const wrap = priceRow.appendChild(el('label', null, label));
      const input = wrap.appendChild(el('input'));
      input.type = 'number';
      input.min = '0';
      input.step = 'any';
      input.dataset.keep = 'price-' + key;
      input.value = typed[input.dataset.keep] !== undefined ? typed[input.dataset.keep] : (price[key] !== undefined ? price[key] : '');
      inputs[key] = input;
    }
    const savePrice = priceRow.appendChild(el('button', 'main', '保存价格'));
    savePrice.type = 'button';
    savePrice.addEventListener('click', async () => {
      const values = {};
      for (const [key] of fields) {
        if (inputs[key].value === '') continue;
        values[key] = Number(inputs[key].value);
      }
      const result = await call('/api/price', { model: state.model, price: values });
      say(result.ok ? state.model + ' 的价格已保存。' : result.error, result.ok ? 'good' : 'bad');
    });
    $('price-note').textContent = state.price
      ? '这是 ' + state.model + ' 现在用来估算的价格，可以改成你实际的价格。'
      : state.model + ' 还没有价格，所以它的用量没有计入估算费用。填上后就会计入。';
  }

  $('model').addEventListener('click', () => {
    if (!state) return;
    delete settings.dataset.ready;  // 每次打开都从当前状态重新开始，不保留上次打开时填了一半的内容
    $('keys').replaceChildren();
    $('price').replaceChildren();
    say('');
    renderSettings();
    settings.showModal();
  });
  $('close-settings').addEventListener('click', () => settings.close());
  pickProvider.addEventListener('change', () => fillModels(pickProvider.value, ''));
  $('apply-model').addEventListener('click', async () => {
    if (!pickModel.value) return;
    const result = await call('/api/model', { provider: pickProvider.value, model: pickModel.value });
    if (result.ok) settings.close(); else say(result.error, 'bad');
  });

  // ---- 连接事件流 ----------------------------------------------------------

  if (!token) {
    showBanner('地址里缺少口令（token）。请使用终端里显示的完整地址打开。');
    return;
  }
  const source = new EventSource('/events?token=' + encodeURIComponent(token));
  source.onopen = () => { banner.hidden = true; };
  source.onmessage = (message) => {
    const event = JSON.parse(message.data);
    const handle = handlers[event.type];
    if (handle) handle(event);
  };
  source.onerror = () => {
    showBanner(source.readyState === EventSource.CLOSED
      ? '连接已断开：助手程序可能已经退出或重新启动了。请回到终端，用那里显示的新地址打开。'
      : '连接中断，正在重连……');
  };
})();
</script>
</body>
</html>
